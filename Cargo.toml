[package]
name = "sv2-cpu-miner"
description = "Sv2 CPU Miner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib/mod.rs"

[dependencies]
stratum-apps = { git = "https://github.com/stratum-mining/sv2-apps", rev = "2792cf3d0aa1a109125d5230bec962a3ad41becc" }
tokio = { version = "1", features = ["full", "tracing", "signal"] }
tokio-util = "0.7.15"
tracing = "0.1"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
async-channel = "1.5.1"

[dev-dependencies]
integration_tests_sv2 = { git = "https://github.com/stratum-mining/sv2-apps", rev = "2792cf3d0aa1a109125d5230bec962a3ad41becc" }
tracing-subscriber = "0.3.19"

# sv2-cpu-miner needs SupportedChannelTypes::StandardAndExtended, which is not yet on
# stratum main. Point at the feature branch on the plebhash fork; drop this section and
# re-pin via Cargo.lock once the upstream PR merges.
[patch."https://github.com/stratum-mining/stratum"]
stratum-core = { git = "https://github.com/plebhash/stratum", branch = "2026-09-16-standard-and-extended-channel-type" }
